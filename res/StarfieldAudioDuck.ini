[Settings]
; Set to 0 to disable the plugin without removing it from MO2.
bEnable=1

; Music volume applied when another Windows audio session becomes active.
; Starfield's normal range is 0.0 to 1.0. The default fully mutes music.
fMutedMusicVolume=0.0

; Minimum time external audio must remain active before music is muted.
; Set to 0 to apply the original immediate-transition behavior.
fActivationDelaySeconds=2.5

; Delay before the latest user-selected music volume is applied after all external sessions become inactive.
fRestoreDelaySeconds=0.5

; Count Windows/system audio sessions whose process ID is 0 as external audio.
bIncludeSystemSessions=1

; Detect Starfield Galactic Radio's in-process MCI playback and treat audible radio
; playback as external audio. Set to 0 to disable this optional compatibility hook.
bEnableGalacticRadioCompatibility=1
